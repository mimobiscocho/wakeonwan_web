<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { font-family: sans-serif; background:#1f2937; color:#f9fafb; }</style>
</head>
<body class="flex items-center justify-center h-screen">
  <form method="post" class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-sm">
    <h1 class="text-2xl mb-4">Se connecter</h1>
    {% if error %}
      <div class="bg-red-500 text-white p-2 mb-4 rounded">{{ error }}</div>
    {% endif %}
    <label class="block mb-2">Utilisateur
      <input name="username" required class="w-full p-2 rounded bg-gray-700"/>
    </label>
    <label class="block mb-4">Mot de passe
      <input name="password" type="password" required class="w-full p-2 rounded bg-gray-700"/>
    </label>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded">Connexion</button>
  </form>
</body>
</html>
